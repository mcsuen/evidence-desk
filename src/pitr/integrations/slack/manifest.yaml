display_information:
  name: PITR Research
  description: 本机私有研究工作区与通用工作流入口
  background_color: '#1D6470'
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: PITR Research
    always_online: false
  slash_commands:
    - command: /research
      description: 发起研究、查询进度、来源和审核结果
      usage_hint: help
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:history
      - im:read
      - im:write
      - app_mentions:read
      - files:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - app_mention
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
